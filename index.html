<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rule-Based Analytics Chatbot</title>

<link rel="stylesheet" href="style.css">

</head>
<body>

<div class="container">

    <h1>📊 Rule-Based Analytics Chatbot</h1>

    <div class="cards">

        <div class="card">
            <h2 id="orders">0</h2>
            <p>Total Orders</p>
        </div>

        <div class="card">
            <h2 id="revenue">0</h2>
            <p>Total Revenue</p>
        </div>

        <div class="card">
            <h2 id="customers">0</h2>
            <p>Customers</p>
        </div>

        <div class="card">
            <h2 id="product">-</h2>
            <p>Most Sold Product</p>
        </div>

    </div>

    <div class="chat-box" id="chatBox">

        <div class="bot">
            Hello! Type <b>help</b> to see available commands.
        </div>

    </div>

    <div class="input-area">

        <input
        id="message"
        type="text"
        placeholder="Ask something...">

        <button onclick="sendMessage()">
            Send
        </button>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
